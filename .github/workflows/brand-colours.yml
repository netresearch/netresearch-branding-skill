name: Brand Colours

# Runs Build/Scripts/check-brand-colours.py against every tracked CSS, SCSS,
# SVG, HTML, Markdown (fenced code), JSON and YAML file. The script exits
# non-zero when a colour value is a near miss of a brand colour (#2F99A4,
# #585961, #FF4D00) — the class of defect the canonical symbol carried as
# #2999a4 / #595a62 while references/logo.md forbade it. Its unit tests run
# first. Both are uv scripts whose inline metadata pins their parser
# dependencies; uv itself is pinned here.

on:
  push:
    branches: [main]
    paths:
      - '**.svg'
      - '**.css'
      - '**.scss'
      - '**.html'
      - '**.md'
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - 'Build/Scripts/check-brand-colours.py'
      - 'Build/Scripts/tests/test_check_brand_colours.py'
      - '.github/workflows/brand-colours.yml'
  pull_request:
    paths:
      - '**.svg'
      - '**.css'
      - '**.scss'
      - '**.html'
      - '**.md'
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - 'Build/Scripts/check-brand-colours.py'
      - 'Build/Scripts/tests/test_check_brand_colours.py'
      - '.github/workflows/brand-colours.yml'
  merge_group:

permissions: {}

jobs:
  brand-colours:
    name: Brand colour near misses
    uses: netresearch/.github/.github/workflows/script-check.yml@main
    permissions:
      contents: read
    with:
      pre-command: pipx install uv==0.12.19
      check-cmd: |
        uv run Build/Scripts/tests/test_check_brand_colours.py
        uv run Build/Scripts/check-brand-colours.py
