name: Deploy demo page

# Publishes site/ to GitHub Pages at
# https://netresearch.github.io/netresearch-branding-skill/
#
# Both jobs call shared reusable workflows, so this repo carries no
# step-level `uses:` of its own — every action lives in
# netresearch/.github. site/ is a checked-in static directory, so the
# "build" half only sanity-checks it before the upload; the build job
# hands the site to the deploy job through the `github-pages-site`
# artifact (both reusables default to that name).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    uses: netresearch/.github/.github/workflows/pages-build.yml@main
    permissions:
      contents: read     # checkout only; no Pages scopes needed to build
    with:
      # Static, pre-built site — no generator needs the deployed base path.
      configure-pages: false
      artifact-path: site
      build-command: test -f site/index.html

  deploy:
    name: Deploy to Pages
    needs: build
    uses: netresearch/.github/.github/workflows/pages-deploy.yml@main
    permissions:
      pages: write       # to deploy to Pages
      id-token: write    # to verify the deployment originates from this workflow
      contents: read     # to download the built-site artifact
    with:
      artifact-path: ./site
